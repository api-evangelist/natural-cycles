name: Natural Cycles
description: >-
  Natural Cycles is a Swedish women's-health company behind the first birth-control
  application cleared by the US FDA (2018) and CE-marked in Europe as a Class IIb
  medical device. Its subscription app uses a proprietary temperature-based algorithm
  to identify fertile and non-fertile days from a user's daily basal body temperature,
  supporting both preventing and planning pregnancy as well as cycle, ovulation, and
  perimenopause tracking. Temperature is captured with a paired Bluetooth basal
  thermometer or through consumer wearables the app integrates with — Apple Watch,
  Oura Ring, and the NC B1 band. Natural Cycles publishes clinical research, an
  educational content library (CycleMatters), an e-commerce shop for thermometers and
  tests, and a public bug-bounty / responsible-disclosure program, but it does not
  expose a public developer API, developer portal, or OpenAPI. Backed by EQT Ventures.
